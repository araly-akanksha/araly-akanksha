<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 56" width="100%">
  <defs>
    <linearGradient id="div-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="15%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#13103a"/>
      <stop offset="85%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="div-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56,189,248,0)"/>
      <stop offset="20%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="rgba(56,189,248,0)"/>
    </linearGradient>
    <filter id="dg" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="56" fill="url(#div-bg)"/>
  <line x1="0" y1="28" x2="1000" y2="28" stroke="url(#div-line)" stroke-width="1.5" filter="url(#dg)"/>
  <!-- Diamond accent -->
  <rect x="490" y="20" width="20" height="20" rx="4" fill="#13103a" stroke="url(#div-line)" stroke-width="1.5" transform="rotate(45 500 30)" filter="url(#dg)"/>
</svg>
