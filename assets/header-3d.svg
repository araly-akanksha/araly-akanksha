<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="neon-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.1)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <linearGradient id="node-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filters for Glow & 3D Shadows -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow-3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="440" rx="24" fill="url(#bg-grad)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1000" height="440" fill="url(#cyber-grid)"/>
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="140" cy="120" r="190" fill="#38bdf8" opacity="0.14" filter="url(#glow-heavy)"/>
  <circle cx="860" cy="320" r="210" fill="#c084fc" opacity="0.16" filter="url(#glow-heavy)"/>
  <circle cx="520" cy="220" r="130" fill="#fbbf24" opacity="0.09" filter="url(#glow-heavy)"/>

  <!-- 3D Neural Network & Bioacoustics Graphics (Right Side) -->
  <g transform="translate(670, 75)" filter="url(#shadow-3d)">
    <!-- Interconnecting Glowing Neural Paths -->
    <path d="M 40 50 L 140 20 L 220 80 L 160 170 L 60 150 Z" fill="none" stroke="url(#neon-cyan)" stroke-width="2.5" opacity="0.7"/>
    <path d="M 140 20 L 140 105 L 60 150" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8"/>
    <path d="M 140 105 L 220 80" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
    <path d="M 140 105 L 160 170" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>

    <!-- Waveform Audio Frequency Bars (Bioacoustics Signal) -->
    <g transform="translate(20, 190)" opacity="0.85">
      <rect x="0" y="20" width="4" height="25" rx="2" fill="#38bdf8"/>
      <rect x="8" y="10" width="4" height="45" rx="2" fill="#818cf8"/>
      <rect x="16" y="0" width="4" height="65" rx="2" fill="#c084fc"/>
      <rect x="24" y="15" width="4" height="35" rx="2" fill="#38bdf8"/>
      <rect x="32" y="25" width="4" height="15" rx="2" fill="#34d399"/>
      <rect x="40" y="5" width="4" height="55" rx="2" fill="#fbbf24"/>
      <rect x="48" y="20" width="4" height="25" rx="2" fill="#38bdf8"/>
    </g>

    <!-- Glowing 3D Nodes -->
    <g transform="translate(140, 20)">
      <circle r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow-soft)"/>
      <circle r="6" fill="#38bdf8"/>
    </g>

    <g transform="translate(220, 80)">
      <circle r="12" fill="#0f172a" stroke="#c084fc" stroke-width="3" filter="url(#glow-soft)"/>
      <circle r="5" fill="#c084fc"/>
    </g>

    <g transform="translate(160, 170)">
      <circle r="15" fill="#0f172a" stroke="#fbbf24" stroke-width="3" filter="url(#glow-soft)"/>
      <circle r="6" fill="#fbbf24"/>
    </g>

    <g transform="translate(60, 150)">
      <circle r="13" fill="#0f172a" stroke="#34d399" stroke-width="3" filter="url(#glow-soft)"/>
      <circle r="5" fill="#34d399"/>
    </g>

    <!-- Core AI Hub Node -->
    <g transform="translate(140, 105)">
      <circle r="24" fill="#0b0f19" stroke="url(#neon-cyan)" stroke-width="4" filter="url(#glow-heavy)"/>
      <circle r="10" fill="#38bdf8"/>
    </g>

    <!-- Floating 3D Badge: Bioacoustics & XAI -->
    <g transform="translate(25, 230)" filter="url(#shadow-3d)">
      <rect x="0" y="0" width="235" height="52" rx="26" fill="url(#glass-card)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
      <circle cx="30" cy="26" r="14" fill="url(#node-glow)" filter="url(#glow-soft)"/>
      <text x="30" y="31" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">🐝</text>
      <text x="56" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Bioacoustic AI &amp; XAI</text>
      <text x="56" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">CNN • EfficientNet • SHAP</text>
    </g>
  </g>

  <!-- Left Side Content Panel -->
  <g transform="translate(60, 70)">
    <!-- Top Pill Badge -->
    <g filter="url(#shadow-3d)">
      <rect x="0" y="0" width="325" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="20" cy="18" r="5" fill="#34d399" filter="url(#glow-soft)"/>
      <text x="36" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="1">
        MSc BIG DATA ANALYTICS @ SJU
      </text>
    </g>

    <!-- Main Title: Araly Akanksha Naidu -->
    <text x="0" y="102" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" fill="#ffffff" filter="url(#shadow-3d)" letter-spacing="-0.5">
      Araly Akanksha Naidu
    </text>

    <!-- Subtitle with Glowing Gradient -->
    <text x="0" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="url(#neon-cyan)" filter="url(#glow-soft)">
      Data Scientist &amp; Deep Learning Researcher
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#cbd5e1">
      <tspan x="0" dy="0">Triple-Major Foundation in Computer Science, Statistics &amp; Economics.</tspan>
      <tspan x="0" dy="24">Specializing in Bioacoustic Deep Learning, Transfer Learning, and XAI.</tspan>
    </text>

    <!-- 3D Pill Tags (Tech Stack) -->
    <g transform="translate(0, 230)" filter="url(#shadow-3d)">
      <!-- Tag 1: Python & SQL -->
      <rect x="0" y="0" width="130" height="38" rx="14" fill="url(#glass-card)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
      <text x="18" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">🐍 Python &amp; SQL</text>

      <!-- Tag 2: PyTorch & TF -->
      <rect x="142" y="0" width="150" height="38" rx="14" fill="url(#glass-card)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5"/>
      <text x="158" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c084fc">🔥 PyTorch / TF</text>

      <!-- Tag 3: XAI -->
      <rect x="304" y="0" width="175" height="38" rx="14" fill="url(#glass-card)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5"/>
      <text x="320" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">💡 SHAP • LIME</text>
    </g>

    <!-- Status & Location Row -->
    <g transform="translate(0, 295)">
      <text x="0" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
        📍 Bangalore, India &amp;nbsp;&amp;nbsp;|&amp;nbsp;&amp;nbsp; 🎓 MSc BDA @ St. Joseph's University &amp;nbsp;&amp;nbsp;|&amp;nbsp;&amp;nbsp; 🚀 Open to AI/ML Roles
      </text>
    </g>
  </g>

  <!-- Bottom Glowing Edge Divider -->
  <rect x="0" y="434" width="1000" height="6" rx="3" fill="url(#neon-cyan)"/>
</svg>
