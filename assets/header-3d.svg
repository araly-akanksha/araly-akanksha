<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%">
  <defs>
    <!-- Rich Multi-Stop Background Gradient -->
    <radialGradient id="bg-radial" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Neon Glow Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="neon-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="neon-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glassmorphic Surface Fill -->
    <linearGradient id="glass-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Filters for Intense Glow and Depth Shadow -->
    <filter id="intense-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="depth-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="460" rx="26" fill="url(#bg-radial)"/>

  <!-- Futuristic Cyber Mesh Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="cyber-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36"/>
      <circle cx="36" cy="36" r="1.5" fill="#38bdf8"/>
    </pattern>
    <rect width="1000" height="460" fill="url(#cyber-grid)"/>
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="160" cy="110" r="200" fill="#38bdf8" opacity="0.16" filter="url(#intense-glow)"/>
  <circle cx="850" cy="340" r="220" fill="#c084fc" opacity="0.18" filter="url(#intense-glow)"/>
  <circle cx="520" cy="230" r="140" fill="#fbbf24" opacity="0.10" filter="url(#intense-glow)"/>

  <!-- 3D Isometric AI Core & Orbital Mesh (Right Side) -->
  <g transform="translate(660, 65)" filter="url(#depth-shadow)">
    <!-- Outer Orbital Rings -->
    <ellipse cx="150" cy="140" rx="140" ry="50" fill="none" stroke="url(#neon-cyan)" stroke-width="2" opacity="0.5" transform="rotate(-25 150 140)"/>
    <ellipse cx="150" cy="140" rx="150" ry="45" fill="none" stroke="url(#neon-gold)" stroke-width="1.5" opacity="0.4" transform="rotate(35 150 140)"/>

    <!-- Neural Network Node Grid -->
    <path d="M 40 60 L 150 20 L 240 80 L 180 190 L 70 170 Z" fill="none" stroke="url(#neon-cyan)" stroke-width="2.5" opacity="0.75"/>
    <path d="M 150 20 L 150 115 L 70 170" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.85"/>
    <path d="M 150 115 L 240 80" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.85"/>
    <path d="M 150 115 L 180 190" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.85"/>

    <!-- Waveform Audio Frequency Spectrum (Bioacoustics) -->
    <g transform="translate(25, 210)" opacity="0.9">
      <rect x="0" y="22" width="5" height="28" rx="2.5" fill="#38bdf8" filter="url(#soft-glow)"/>
      <rect x="10" y="10" width="5" height="52" rx="2.5" fill="#818cf8" filter="url(#soft-glow)"/>
      <rect x="20" y="0" width="5" height="72" rx="2.5" fill="#c084fc" filter="url(#soft-glow)"/>
      <rect x="30" y="18" width="5" height="38" rx="2.5" fill="#38bdf8"/>
      <rect x="40" y="28" width="5" height="18" rx="2.5" fill="#34d399"/>
      <rect x="50" y="8" width="5" height="60" rx="2.5" fill="#fbbf24" filter="url(#soft-glow)"/>
      <rect x="60" y="24" width="5" height="28" rx="2.5" fill="#38bdf8"/>
    </g>

    <!-- Glowing Nodes -->
    <g transform="translate(150, 20)">
      <circle r="15" fill="#0b0f19" stroke="#38bdf8" stroke-width="3.5" filter="url(#soft-glow)"/>
      <circle r="6" fill="#38bdf8"/>
    </g>

    <g transform="translate(240, 80)">
      <circle r="13" fill="#0b0f19" stroke="#c084fc" stroke-width="3.5" filter="url(#soft-glow)"/>
      <circle r="5" fill="#c084fc"/>
    </g>

    <g transform="translate(180, 190)">
      <circle r="16" fill="#0b0f19" stroke="#fbbf24" stroke-width="3.5" filter="url(#soft-glow)"/>
      <circle r="6" fill="#fbbf24"/>
    </g>

    <g transform="translate(70, 170)">
      <circle r="14" fill="#0b0f19" stroke="#34d399" stroke-width="3.5" filter="url(#soft-glow)"/>
      <circle r="5" fill="#34d399"/>
    </g>

    <!-- Center AI Pulse Engine -->
    <g transform="translate(150, 115)">
      <circle r="26" fill="#030712" stroke="url(#neon-cyan)" stroke-width="4.5" filter="url(#intense-glow)"/>
      <circle r="11" fill="#38bdf8"/>
    </g>

    <!-- Floating 3D Badge: Bioacoustics AI -->
    <g transform="translate(30, 248)" filter="url(#depth-shadow)">
      <rect x="0" y="0" width="245" height="54" rx="27" fill="url(#glass-surface)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <circle cx="32" cy="27" r="15" fill="url(#neon-emerald)" filter="url(#soft-glow)"/>
      <text x="32" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">🐝</text>
      <text x="60" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Bioacoustic AI &amp; XAI</text>
      <text x="60" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">CNN • EfficientNet • SHAP</text>
    </g>
  </g>

  <!-- Left Side Content Panel -->
  <g transform="translate(60, 65)">
    <!-- Top Pill Badge -->
    <g filter="url(#depth-shadow)">
      <rect x="0" y="0" width="335" height="38" rx="19" fill="rgba(56, 189, 248, 0.14)" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="22" cy="19" r="5.5" fill="#34d399" filter="url(#soft-glow)"/>
      <text x="38" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="1">
        MSc BIG DATA ANALYTICS @ SJU
      </text>
    </g>

    <!-- Main Title: Araly Akanksha Naidu -->
    <text x="0" y="108" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" fill="#ffffff" filter="url(#depth-shadow)" letter-spacing="-0.8">
      Araly Akanksha Naidu
    </text>

    <!-- Subtitle with Glowing Neon Gradient -->
    <text x="0" y="148" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="url(#neon-cyan)" filter="url(#soft-glow)">
      Data Scientist &amp; Deep Learning Researcher
    </text>

    <!-- Description Lines -->
    <text x="0" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#cbd5e1" line-height="1.6">
      <tspan x="0" dy="0">Triple-Major Foundation in Computer Science, Statistics &amp; Economics.</tspan>
      <tspan x="0" dy="25">Specializing in Bioacoustic Deep Learning, Transfer Learning, and XAI.</tspan>
    </text>

    <!-- 3D Pill Tags (Tech Stack Quick Highlights) -->
    <g transform="translate(0, 242)" filter="url(#depth-shadow)">
      <!-- Tag 1: Python & SQL -->
      <rect x="0" y="0" width="135" height="40" rx="15" fill="url(#glass-surface)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5"/>
      <text x="18" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">🐍 Python &amp; SQL</text>

      <!-- Tag 2: PyTorch & TF -->
      <rect x="147" y="0" width="155" height="40" rx="15" fill="url(#glass-surface)" stroke="rgba(192, 132, 252, 0.45)" stroke-width="1.5"/>
      <text x="163" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c084fc">🔥 PyTorch / TF</text>

      <!-- Tag 3: XAI -->
      <rect x="314" y="0" width="180" height="40" rx="15" fill="url(#glass-surface)" stroke="rgba(251, 191, 36, 0.45)" stroke-width="1.5"/>
      <text x="330" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">💡 SHAP • LIME</text>
    </g>

    <!-- Status & Location Footer Line -->
    <g transform="translate(0, 312)">
      <text x="0" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#94a3b8">
        📍 Bangalore, India &amp;nbsp;&amp;nbsp;|&amp;nbsp;&amp;nbsp; 🎓 MSc BDA @ St. Joseph's University &amp;nbsp;&amp;nbsp;|&amp;nbsp;&amp;nbsp; 🚀 Open to AI/ML Roles
      </text>
    </g>
  </g>

  <!-- Bottom Glowing Edge Accent Bar -->
  <rect x="0" y="453" width="1000" height="7" rx="3.5" fill="url(#neon-cyan)"/>
</svg>
