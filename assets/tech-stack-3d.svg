<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%">
  <defs>
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="tile-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="tile-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="920" height="220" rx="20" fill="url(#tech-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Section Title -->
  <text x="460" y="36" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    CORE TECH STACK &amp; TOOLKIT
  </text>
  <line x1="330" y1="46" x2="590" y2="46" stroke="url(#glow-cyan)" stroke-width="2"/>

  <!-- Tile Grid -->
  <g transform="translate(35, 68)" filter="url(#tile-shadow)">
    <!-- Tile 1: Python & SQL -->
    <g transform="translate(0, 0)">
      <rect width="260" height="58" rx="14" fill="url(#tile-glass)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
      <circle cx="30" cy="29" r="14" fill="rgba(56, 189, 248, 0.2)"/>
      <path d="M 26 23 L 34 29 L 26 35" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="27" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Python &amp; SQL</text>
      <text x="56" y="43" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#38bdf8">Scripting • Queries • Data</text>
    </g>

    <!-- Tile 2: PyTorch & TensorFlow -->
    <g transform="translate(295, 0)">
      <rect width="260" height="58" rx="14" fill="url(#tile-glass)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5"/>
      <circle cx="30" cy="29" r="14" fill="rgba(192, 132, 252, 0.2)"/>
      <polygon points="30,20 37,34 23,34" fill="none" stroke="#c084fc" stroke-width="2"/>
      <text x="56" y="27" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">PyTorch &amp; TensorFlow</text>
      <text x="56" y="43" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#c084fc">CNN / CRNN • Transfer Learning</text>
    </g>

    <!-- Tile 3: Explainable AI -->
    <g transform="translate(590, 0)">
      <rect width="260" height="58" rx="14" fill="url(#tile-glass)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5"/>
      <circle cx="30" cy="29" r="14" fill="rgba(251, 191, 36, 0.2)"/>
      <circle cx="30" cy="26" r="6" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <line x1="30" y1="32" x2="30" y2="36" stroke="#fbbf24" stroke-width="2"/>
      <text x="56" y="27" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Explainable AI (XAI)</text>
      <text x="56" y="43" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#fbbf24">SHAP • LIME • Grad-CAM</text>
    </g>

    <!-- Row 2 -->
    <!-- Tile 4: Scikit-Learn & ML -->
    <g transform="translate(0, 72)">
      <rect width="260" height="58" rx="14" fill="url(#tile-glass)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5"/>
      <circle cx="30" cy="29" r="14" fill="rgba(52, 211, 153, 0.2)"/>
      <rect x="24" y="23" width="12" height="12" rx="3" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="56" y="27" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Scikit-Learn &amp; ML</text>
      <text x="56" y="43" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#34d399">Supervised ML • NLP • 92% Acc</text>
    </g>

    <!-- Tile 5: Pandas, NumPy & Excel -->
    <g transform="translate(295, 72)">
      <rect width="260" height="58" rx="14" fill="url(#tile-glass)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
      <circle cx="30" cy="29" r="14" fill="rgba(56, 189, 248, 0.2)"/>
      <rect x="23" y="30" width="4" height="8" rx="1" fill="#38bdf8"/>
      <rect x="28" y="25" width="4" height="13" rx="1" fill="#38bdf8"/>
      <rect x="33" y="20" width="4" height="18" rx="1" fill="#38bdf8"/>
      <text x="56" y="27" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Pandas, NumPy &amp; Excel</text>
      <text x="56" y="43" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#38bdf8">Data Wrangling • Adv Excel</text>
    </g>

    <!-- Tile 6: MongoDB & Java -->
    <g transform="translate(590, 72)">
      <rect width="260" height="58" rx="14" fill="url(#tile-glass)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5"/>
      <circle cx="30" cy="29" r="14" fill="rgba(192, 132, 252, 0.2)"/>
      <circle cx="30" cy="29" r="7" fill="none" stroke="#c084fc" stroke-width="2"/>
      <text x="56" y="27" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">MongoDB &amp; Java</text>
      <text x="56" y="43" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#c084fc">NoSQL • Object Oriented</text>
    </g>
  </g>
</svg>
