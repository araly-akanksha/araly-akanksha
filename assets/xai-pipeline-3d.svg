<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="card-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.14)"/>
      <stop offset="100%" stop-color="rgba(56,189,248,0.03)"/>
    </linearGradient>

    <linearGradient id="card-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(192,132,252,0.14)"/>
      <stop offset="100%" stop-color="rgba(192,132,252,0.03)"/>
    </linearGradient>

    <linearGradient id="card-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(52,211,153,0.14)"/>
      <stop offset="100%" stop-color="rgba(52,211,153,0.03)"/>
    </linearGradient>

    <filter id="gl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1000" height="310" rx="20" fill="url(#bg2)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top glow -->
  <ellipse cx="500" cy="0" rx="400" ry="80" fill="#6d28d9" opacity="0.18" filter="url(#gl)"/>

  <!-- Header -->
  <text x="500" y="42" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" letter-spacing="3" fill="#818cf8">ANALYTICS → DEEP LEARNING → EXPLAINABILITY</text>

  <!-- Flow line with arrow heads -->
  <line x1="88" y1="170" x2="348" y2="170" stroke="url(#flow)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="348,163 362,170 348,177" fill="#818cf8"/>
  <line x1="638" y1="170" x2="898" y2="170" stroke="url(#flow)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="898,163 912,170 898,177" fill="#34d399"/>

  <!-- Card 1: Data & Bioacoustics -->
  <g transform="translate(28, 68)" filter="url(#sh)">
    <rect width="300" height="190" rx="18" fill="url(#card-1)" stroke="rgba(56,189,248,0.5)" stroke-width="1.5"/>
    <circle cx="150" cy="52" r="28" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="2" filter="url(#gl)"/>
    <!-- Audio Wave Icon -->
    <path d="M 138 52 L 138 44 M 144 52 L 144 38 M 150 52 L 150 34 M 156 52 L 156 40 M 162 52 L 162 46" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="12" y="10" width="28" height="20" rx="6" fill="rgba(56,189,248,0.3)"/>
    <text x="26" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">01</text>
    <text x="150" y="102" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#fff">Data &amp; Bioacoustics</text>
    <text x="150" y="124" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Audio signal processing</text>
    <text x="150" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Spectrograms &amp; cleaning</text>
    <rect x="20"  y="158" width="76"  height="20" rx="10" fill="rgba(56,189,248,0.2)"/>
    <text x="58"  y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Pandas</text>
    <rect x="104" y="158" width="76"  height="20" rx="10" fill="rgba(56,189,248,0.2)"/>
    <text x="142" y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Librosa</text>
    <rect x="188" y="158" width="76"  height="20" rx="10" fill="rgba(56,189,248,0.2)"/>
    <text x="226" y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">NumPy</text>
  </g>

  <!-- Card 2: Deep Learning -->
  <g transform="translate(350, 68)" filter="url(#sh)">
    <rect width="300" height="190" rx="18" fill="url(#card-2)" stroke="rgba(192,132,252,0.5)" stroke-width="1.5"/>
    <circle cx="150" cy="52" r="28" fill="rgba(192,132,252,0.15)" stroke="#c084fc" stroke-width="2" filter="url(#gl)"/>
    <!-- Neural Node Icon -->
    <circle cx="140" cy="46" r="4" fill="#c084fc"/>
    <circle cx="160" cy="46" r="4" fill="#c084fc"/>
    <circle cx="150" cy="60" r="5" fill="#c084fc"/>
    <line x1="140" y1="46" x2="150" y2="60" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="160" y1="46" x2="150" y2="60" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="12" y="10" width="28" height="20" rx="6" fill="rgba(192,132,252,0.3)"/>
    <text x="26" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#c084fc">02</text>
    <text x="150" y="102" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#fff">Deep Learning</text>
    <text x="150" y="124" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">CNN / CRNN architectures</text>
    <text x="150" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">EfficientNetV2 Transfer</text>
    <rect x="20"  y="158" width="76"  height="20" rx="10" fill="rgba(192,132,252,0.2)"/>
    <text x="58"  y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#c084fc">PyTorch</text>
    <rect x="104" y="158" width="88"  height="20" rx="10" fill="rgba(192,132,252,0.2)"/>
    <text x="148" y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#c084fc">TensorFlow</text>
    <rect x="200" y="158" width="76"  height="20" rx="10" fill="rgba(192,132,252,0.2)"/>
    <text x="238" y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#c084fc">OpenCV</text>
  </g>

  <!-- Card 3: XAI & Insights -->
  <g transform="translate(672, 68)" filter="url(#sh)">
    <rect width="300" height="190" rx="18" fill="url(#card-3)" stroke="rgba(52,211,153,0.5)" stroke-width="1.5"/>
    <circle cx="150" cy="52" r="28" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="2" filter="url(#gl)"/>
    <!-- Lightbulb Vector Icon -->
    <circle cx="150" cy="48" r="8" fill="none" stroke="#34d399" stroke-width="2"/>
    <path d="M 146 56 L 154 56 M 147 59 L 153 59" stroke="#34d399" stroke-width="2"/>
    <rect x="12" y="10" width="28" height="20" rx="6" fill="rgba(52,211,153,0.3)"/>
    <text x="26" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">03</text>
    <text x="150" y="102" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#fff">XAI &amp; Insights</text>
    <text x="150" y="124" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Feature attribution maps</text>
    <text x="150" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Trustworthy AI decisions</text>
    <rect x="20"  y="158" width="64"  height="20" rx="10" fill="rgba(52,211,153,0.2)"/>
    <text x="52"  y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#34d399">SHAP</text>
    <rect x="92"  y="158" width="64"  height="20" rx="10" fill="rgba(52,211,153,0.2)"/>
    <text x="124" y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#34d399">LIME</text>
    <rect x="164" y="158" width="100" height="20" rx="10" fill="rgba(52,211,153,0.2)"/>
    <text x="214" y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#34d399">Grad-CAM</text>
  </g>

  <!-- Footer tagline -->
  <text x="500" y="285" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#4b5563" font-style="italic">
    Building transparent, high-impact AI — from raw signal to interpretable decisions.
  </text>

  <!-- Bottom accent line -->
  <rect x="0" y="303" width="1000" height="7" rx="3.5" fill="url(#flow)" filter="url(#gl)"/>
</svg>
