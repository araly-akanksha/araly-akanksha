<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="xai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#19173c"/>
    </linearGradient>

    <!-- Connector Flow Gradient -->
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.09)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="920" height="310" rx="18" fill="url(#xai-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Section Header -->
  <text x="460" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    ANALYTICS &amp; EXPLAINABLE AI (XAI) PIPELINE
  </text>
  <line x1="310" y1="50" x2="610" y2="50" stroke="url(#flow-grad)" stroke-width="2.5"/>

  <!-- Connecting Flow Lines -->
  <path d="M 180 165 L 340 165 M 480 165 L 640 165" stroke="url(#flow-grad)" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Step 1: Raw Data & Bioacoustics -->
  <g transform="translate(45, 80)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="225" height="175" rx="14" fill="url(#glass-card)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <circle cx="112" cy="42" r="22" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="2" filter="url(#glow-light)"/>
    <text x="112" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">🎙️</text>
    
    <text x="112" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1. Data &amp; Bioacoustics</text>
    <text x="112" y="113" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Audio Signal Processing</text>
    <text x="112" y="129" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Spectrograms &amp; Cleaning</text>
    <text x="112" y="147" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8" font-weight="600" text-anchor="middle">Pandas • NumPy • Librosa</text>
  </g>

  <!-- Step 2: Deep Learning Architectures -->
  <g transform="translate(347, 80)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="225" height="175" rx="14" fill="url(#glass-card)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5"/>
    <circle cx="112" cy="42" r="22" fill="rgba(192, 132, 252, 0.2)" stroke="#c084fc" stroke-width="2" filter="url(#glow-light)"/>
    <text x="112" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">🧠</text>
    
    <text x="112" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2. Deep Learning</text>
    <text x="112" y="113" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">CNN / CRNN Architectures</text>
    <text x="112" y="129" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">EfficientNetV2 Transfer</text>
    <text x="112" y="147" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c084fc" font-weight="600" text-anchor="middle">PyTorch • TensorFlow</text>
  </g>

  <!-- Step 3: Explainable AI & Insights -->
  <g transform="translate(650, 80)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="225" height="175" rx="14" fill="url(#glass-card)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5"/>
    <circle cx="112" cy="42" r="22" fill="rgba(52, 211, 153, 0.2)" stroke="#34d399" stroke-width="2" filter="url(#glow-light)"/>
    <text x="112" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">💡</text>
    
    <text x="112" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3. XAI &amp; Insights</text>
    <text x="112" y="113" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Feature Attribution Maps</text>
    <text x="112" y="129" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Trustworthy AI Decisions</text>
    <text x="112" y="147" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399" font-weight="600" text-anchor="middle">SHAP • LIME • Grad-CAM</text>
  </g>

  <!-- Bottom Accent Tagline -->
  <text x="460" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
    Building transparent, high-performing AI solutions from raw data to interpretable business value.
  </text>
</svg>
